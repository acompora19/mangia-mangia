# Deploys the Cloudflare helper whenever worker/ changes. Needs three repo secrets:
#   CLOUDFLARE_API_TOKEN  (a token with "Edit Cloudflare Workers" permission)
#   CLOUDFLARE_ACCOUNT_ID
#   TOKENS                (the connector access codes, as JSON — one entry per person; re-uploaded on every deploy)
name: Deploy helper
on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
          secrets: |
            TOKENS
        env:
          TOKENS: ${{ secrets.TOKENS }}
