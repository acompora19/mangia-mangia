<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mangia Mangia</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="icon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b7322c">
<meta name="apple-mobile-web-app-title" content="Mangia">
<meta property="og:title" content="Mangia Mangia">
<meta property="og:description" content="Our shared recipe box. Add yours, borrow ours, argue about it later.">
<meta property="og:image" content="https://acompora19.github.io/mangia-mangia/icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap">
<style>
/* base reset */
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
/* Layout: a trattoria recipe box. A gingham tablecloth behind cream recipe cards; one header with a
   tricolore rule, course + cuisine chips, a grid of cards; a recipe opens as a two-column card (ingredients | method). */
:root {
  --bg: #f1e9d8;
  --check: rgba(183, 50, 44, .085);
  --surface: #fffaf0;
  --surface-2: #f3eadb;
  --fg: #2b1d14;
  --muted: #7d6a58;
  --line: #ddcdb5;
  --accent: #b7322c;
  --accent-ink: #fff7ec;
  --accent-soft: #f6e3dd;
  --green: #3a6b3c;
  --warm: #c9962b;
  --danger: #9b2a22;
  --shadow: 0 1px 2px rgba(60,30,10,.08), 0 10px 26px -14px rgba(60,30,10,.28);
  --display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --body: "Lora", Georgia, "Times New Roman", serif;
  --mono: "DM Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1512; --check: rgba(183, 50, 44, .16); --surface: #2a211b; --surface-2: #342922; --fg: #f3e8d6; --muted: #b3a08c;
    --line: #4a3b31; --accent: #c93a33; --accent-ink: #fff7ec; --accent-soft: #4a2420; --green: #5f9c61;
    --warm: #d9a632; --danger: #e8685c;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1c1512; --check: rgba(183, 50, 44, .16); --surface: #2a211b; --surface-2: #342922; --fg: #f3e8d6; --muted: #b3a08c;
  --line: #4a3b31; --accent: #c93a33; --accent-ink: #fff7ec; --accent-soft: #4a2420; --green: #5f9c61;
  --warm: #d9a632; --danger: #e8685c;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background-color: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
/* The tablecloth: a gingham band behind the header that fades out, instead of covering the whole page. */
.cloth { position: absolute; left: 0; right: 0; top: 0; height: 190px; z-index: 0; pointer-events: none;
  background-image: repeating-linear-gradient(0deg, var(--check) 0 14px, transparent 14px 28px), repeating-linear-gradient(90deg, var(--check) 0 14px, transparent 14px 28px);
  -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 80px; }
button { font: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* header */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 16px; }
.brand .mark { flex: none; width: 84px; height: 84px; }
@media (max-width: 520px) { .brand .mark { width: 64px; height: 64px; } }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: clamp(36px, 6vw, 54px); line-height: 1; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.brand h1 em { font-style: italic; font-weight: 400; color: var(--accent); }
.brand p { margin: 8px 0 0; color: var(--muted); font-size: 15px; font-style: italic; }
.brand .eyebrow { font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--green); margin: 0 0 8px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); }
.who > span { display: inline-flex; align-items: center; gap: 8px; }
.who img { width: 28px; height: 28px; border-radius: 50%; }
.theme-btn { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; width: 32px; height: 32px; font-size: 16px; line-height: 1; padding: 0; }
.theme-btn:hover { color: var(--fg); }
.tricolore { height: 4px; display: grid; grid-template-columns: 1fr 1fr 1fr; border-radius: 2px; overflow: hidden; margin-top: 14px; }
.tricolore i { display: block; }
.tricolore i:nth-child(1) { background: var(--green); }
.tricolore i:nth-child(2) { background: #fff7ec; outline: 1px solid var(--line); outline-offset: -1px; }
.tricolore i:nth-child(3) { background: var(--accent); }

.btn { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-weight: 500; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 6px 10px; font-size: 14px; }
.btn .n { font-family: var(--mono); font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 1px 7px; border-radius: 999px; }

/* toolbar */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0 10px; }
.search { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 0; }
.search input:focus { outline: none; }
.search svg { flex: none; color: var(--muted); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; width: 100%; }
.chiprow .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin-right: 4px; min-width: 58px; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chiprow.cuisine .chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); }
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 0 0 20px; font-size: 13px; color: var(--muted); }
.filters label { display: inline-flex; align-items: center; gap: 6px; }
.filters select { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; }
.count { font-family: var(--mono); margin-left: auto; }
.cooks { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 12px; }
.cooks-label { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--green); margin-right: 4px; min-width: 58px; }
.cook-chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px 4px 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font-size: 13px; font-weight: 500; }
.cook-chip img { width: 22px; height: 22px; border-radius: 50%; }
.cook-chip i { font-style: normal; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.cook-chip[data-author="all"], .cook-chip.web { padding-left: 10px; }
.cook-chip.web { border-style: dashed; }
.cook-chip.fam { padding-left: 10px; border-color: var(--warm); color: var(--warm); }
.cook-chip.fam[aria-pressed="true"] { background: var(--warm); border-color: var(--warm); color: #2b1d14; }
.cook-chip.fam[aria-pressed="true"] i { color: #2b1d14; }
/* family-recipe badge: a little gold ribbon */
.fam-badge { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #2b1d14; background: var(--warm); padding: 2px 8px 2px 6px; border-radius: 3px; white-space: nowrap; }
.fam-badge svg { width: 11px; height: 11px; }
.card .cat .fam-badge { letter-spacing: .08em; }
.fam-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; font-style: italic; color: var(--fg); }
.fam-line .fam-badge { font-style: normal; }
.cook-chip[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--accent-ink); }
.cook-chip[aria-pressed="true"] i { color: var(--accent-ink); opacity: .8; }

/* grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { text-align: left; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 16px 16px 14px; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; color: inherit; position: relative; min-width: 0; font-family: var(--body); overflow: hidden; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--green); z-index: 1; }
.card:hover { transform: translateY(-2px); border-color: var(--accent); }
.card .photo { margin: -16px -16px 2px -13px; aspect-ratio: 4 / 3; max-width: none; width: calc(100% + 29px); object-fit: cover; display: block; background: var(--surface-2); }
.card .cat { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); display: flex; gap: 8px; flex-wrap: wrap; }
.card .cat .cu { color: var(--green); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1.15; margin: 0; text-wrap: balance; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 13px; color: var(--muted); font-family: var(--mono); margin-top: auto; }
.card .by { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.card .by img { width: 18px; height: 18px; border-radius: 50%; }
.card .star { position: absolute; top: 10px; right: 10px; color: var(--warm); font-size: 16px; z-index: 1; text-shadow: 0 0 4px var(--surface); }
.card .var { font-size: 11px; font-family: var(--mono); color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 0 7px; }
.rating { font-family: var(--mono); font-size: 13px; color: var(--fg); display: inline-flex; gap: 4px; align-items: baseline; }
.rating b { color: var(--warm); font-weight: 500; }
.rating small { color: var(--muted); font-size: 12px; }
.card .by .rating { margin-left: auto; }

/* empty state */
.empty { border: 1px dashed var(--line); border-radius: 12px; padding: 40px 24px; text-align: center; color: var(--muted); max-width: 520px; margin: 30px auto; background: var(--surface); }
.empty h2 { font-family: var(--display); font-weight: 600; color: var(--fg); font-size: 28px; margin: 0 0 8px; }
.empty p { margin: 0 0 16px; }

/* detail */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); overflow: hidden; border-top: 4px solid var(--accent); }
.hero { display: block; width: 100%; max-height: 420px; object-fit: cover; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.detail-head { padding: 22px 24px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.detail-head h2 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.05; margin: 4px 0 10px; text-wrap: balance; }
.detail-head .cat { font-family: var(--mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.detail-head .cat .cu { color: var(--green); margin-left: 10px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.facts b { color: var(--fg); font-weight: 500; }
.actions { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
.detail-body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
.detail-body > div { padding: 22px 24px; min-width: 0; }
.detail-body > .ing { background: var(--surface-2); border-right: 1px solid var(--line); }
.sec-title { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 20px; color: var(--green); margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sec-title small { font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-left: 8px; }
.ing-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-family: var(--body); font-style: normal; font-size: 13px; }
.scale { display: inline-flex; align-items: center; gap: 4px; }
.scale button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); line-height: 1; }
.scale input { width: 52px; text-align: center; font-family: var(--mono); font-size: 13px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.scale .lab { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-right: 4px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--muted); padding: 4px 9px; font-family: var(--mono); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--accent-ink); }
ul.ing-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.ing-list li { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); line-height: 1.4; cursor: pointer; user-select: none; align-items: flex-start; }
ul.ing-list li:last-child { border-bottom: 0; }
ul.ing-list li .box { flex: none; width: 18px; height: 18px; margin-top: 3px; border: 1.5px solid var(--muted); border-radius: 4px; display: grid; place-items: center; font-size: 12px; color: var(--accent-ink); }
ul.ing-list li.done .box { background: var(--green); border-color: var(--green); }
ul.ing-list li.done .txt, ul.ing-list li.done .qty { opacity: .45; text-decoration: line-through; }
ul.ing-list .qty { font-family: var(--mono); font-size: 14px; color: var(--accent); flex: none; min-width: 44px; }
ul.ing-list .txt { flex: 1; }
ul.ing-list .sub { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 12px; line-height: 1; padding: 0; margin-top: 1px; }
ul.ing-list .sub:hover { color: var(--accent); border-color: var(--accent); }
ul.ing-list li.head { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 14px; border-bottom: 0; cursor: default; }
ul.ing-list li.subbox { cursor: default; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; margin: 2px 0 6px; font-size: 14px; white-space: pre-wrap; }
ul.ing-list li.subbox b { color: var(--green); font-weight: 600; display: block; margin-bottom: 4px; font-size: 12px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.ing-hint { font-size: 12px; color: var(--muted); margin: 10px 0 0; font-style: italic; }
.equip { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed var(--line); }
.equip .sec-title { font-size: 17px; margin-bottom: 8px; }
ul.equip-list { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
ul.equip-list li { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
ol.steps { margin: 0; padding: 0; list-style: none; counter-reset: step; display: flex; flex-direction: column; gap: 14px; max-width: 62ch; }
ol.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; counter-increment: step; }
ol.steps li::before { content: counter(step); font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1; color: var(--accent); }
.notes { margin-top: 22px; padding: 14px 16px; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0; font-size: 15px; font-style: italic; max-width: 62ch; }
.notes .sec-title { margin-bottom: 6px; font-size: 18px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tag { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); }
.byline { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); margin-top: 10px; }
.byline img { width: 22px; height: 22px; border-radius: 50%; }
.source, .variant-of { font-size: 14px; color: var(--muted); margin-top: 6px; }
.source a, .variant-of a, .variant-of button { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; text-decoration: underline; }
.variations { border-top: 1px solid var(--line); padding: 16px 24px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.variations .sec-title { margin: 0; font-size: 18px; }
.variations button.vlink { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 12px; font-size: 14px; color: var(--fg); }
.variations button.vlink:hover { border-color: var(--accent); }

/* battles */
.battle { border-top: 1px solid var(--line); padding: 18px 24px; background: var(--surface-2); }
.battle-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.battle-head .sec-title { margin: 0; }
.battle-total { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.battle-head .btn { margin-left: auto; }
.sides { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
.side { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.side:last-child { text-align: right; align-items: flex-end; }
.side-name { border: 0; background: none; padding: 0; font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--fg); text-align: inherit; line-height: 1.2; text-decoration: none; }
.side-name:hover { color: var(--accent); }
.side.here .side-name { color: var(--accent); }
.side-n { font-family: var(--mono); font-size: 22px; color: var(--muted); }
.side.lead .side-n, .side.mine .side-n { color: var(--accent); }
.vs { font-family: var(--display); font-style: italic; color: var(--muted); font-size: 16px; }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 10px 0; position: relative; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.bar::after { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--surface); }
.vote { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.vote small { color: var(--muted); font-style: italic; }
.hintline { font-size: 14px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: -4px 0 12px; }
.pick-list { display: flex; flex-direction: column; max-height: 50vh; overflow: auto; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
.pick-row { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--surface); padding: 9px 12px; color: var(--fg); }
.pick-row:last-child { border-bottom: 0; }
.pick-row:hover { background: var(--surface-2); }
.pick-row small { color: var(--muted); font-family: var(--mono); font-size: 11px; flex: none; }
.battle-board { display: flex; flex-direction: column; gap: 16px; margin-bottom: 14px; }
.board-row { padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.board-row small { color: var(--muted); font-size: 12px; font-family: var(--mono); }
.board-row .side-name { font-size: 16px; }
.board-row .side-n { font-size: 18px; }

/* comments ("made it") */
.comments { border-top: 1px solid var(--line); padding: 20px 24px 24px; }
.comments .sec-title { margin-bottom: 14px; }
.rate-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 16px; font-size: 14px; }

<script type="module">

  // STORAGE ADAPTER — the only part that knows where data lives (Firebase Firestore).

  // A tiny shim so the store code below reads like "db.collection(path).onSnapshot(...)".

  const AV_COLORS = ["#b7322c", "#3a6b3c", "#c9962b", "#2f5f8a", "#8a4b9c", "#b0652a", "#2a7f8a", "#7a3b5c"];

  const users = { map: {}, ready: false };
  function makeUser(users_, overrideMe) {
    const stored = overrideMe || ls.get("mm-user", null);

    };
  }
  function store_(db, user) {
    let meCache = null;
    return {
      async me() { meCache = user.me(); return meCache; },

      async profiles(ids) { return user.profiles(ids); },
      subscribeUsers(next) { return db.collection("users").onSnapshot((s) => { users.map = Object.fromEntries(s.docs.map((d) => [d.id, d.data()])); users.ready = true; next(users.map); }, () => { users.ready = true; next(users.map); }); },
      async saveUser(id, data) { await db.doc("users/" + id).set({ ...data, updatedAt: Date.now() }); },
      subscribeRecipes(next, error) { return db.collection("recipes").onSnapshot((s) => next(s.docs.map((d) => normalizeRecipe({ id: d.id, ...d.data() }))), error); },
      async saveRecipe(id, body) { id = id || newId(body.title); await db.doc("recipes/" + id).set(body); return id; },
      async deleteRecipe(id) {
        const cs = await db.collection("recipes/" + id + "/comments").get();
        for (const c of cs.docs) await db.doc("recipes/" + id + "/comments/" + c.id).delete();
        await db.doc("photos/" + id).delete();
        await this.deleteRatingsFor(id);
        await db.doc("recipes/" + id).delete();
      },
      async getPhoto(id) { const s = await db.doc("photos/" + id).get(); return s.exists ? (s.data().data || "") : ""; },
      async setPhoto(id, data) { if (data) await db.doc("photos/" + id).set({ data }); else await db.doc("photos/" + id).delete(); },
      subscribeComments(id, next) { return db.collection("recipes/" + id + "/comments").orderBy("createdAt").onSnapshot((s) => next(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {}); },
      async addComment(id, body) { await db.collection("recipes/" + id + "/comments").add(body); },
      async deleteComment(id, cid) { await db.doc("recipes/" + id + "/comments/" + cid).delete(); },
      subscribeFavs(uid, next) { return db.doc("favorites/" + uid).onSnapshot((s) => next(s.exists ? (s.data().ids || []) : []), () => {}); },
      async setFavs(uid, ids) { await db.doc("favorites/" + uid).set({ ids }); },
      subscribeRatings(next) { return db.collection("ratings").onSnapshot((s) => next(s.docs.map((d) => d.data())), () => {}); },
      async setRating(rid, uid, stars) { const ref = db.doc("ratings/" + rid + "_" + uid); if (stars) await ref.set({ recipeId: rid, userId: uid, stars, updatedAt: Date.now() }); else await ref.delete(); },
      async deleteRatingsFor(rid) { const s = await db.collection("ratings").where("recipeId", "==", rid).get(); for (const d of s.docs) await db.doc("ratings/" + d.id).delete(); },
      subscribeBattles(next) { return db.collection("battles").onSnapshot((s) => next(s.docs.map((d) => ({ id: d.id, ...d.data() }))), () => {}); },

      async deleteBattle(id) { const s = await db.collection("battlevotes").where("battleId", "==", id).get(); for (const d of s.docs) await db.doc("battlevotes/" + d.id).delete(); await db.doc("battles/" + id).delete(); },

    if (!base) return null;

  // ---------- cook mode ----------

    const { perStep, unmatched } = stepIngredients(r);
    const showAll = !perStep.some((s) => s.length);
    const draw = () => {
      const need = perStep[i] || []; const tms = timersIn(steps[i]);
      el.innerHTML = `<div class="cook">
        <div class="cook-top"><h3>${esc(r.title)}</h3><button class="btn sm" id="cookclose">Done</button></div>
        <div class="cook-body">
          <p class="cook-num">Step ${i + 1} of ${steps.length}${factor !== 1 ? ` · serves ${fmtQty(state.servings)}` : ""}${i === 0 ? ` <span class="cook-hint">· tap right side or swipe for next</span>` : ""}</p>
          <p class="cook-step">${esc(steps[i])}</p>

          ${need.length ? `<div class="cook-ings"><p class="sec-title"><span>You'll need</span></p><ul>${need.map((k) => `<li>${esc(scaledLine(lines[k], factor))}</li>`).join("")}</ul></div>` : ""}
          ${i === 0 && (r.equipment || []).length ? `<div class="cook-ings dim"><p class="sec-title"><span>Have ready</span></p><ul>${r.equipment.map((e) => `<li>${esc(e)}</li>`).join("")}</ul></div>` : ""}
          ${i === 0 && (showAll ? lines.filter((l) => !/^#/.test(l)).length : unmatched.length) ? `<div class="cook-ings dim"><p class="sec-title"><span>${showAll ? "Ingredients" : "Also have ready"}</span></p><ul>${(showAll ? lines.map((l, k) => k).filter((k) => !/^#/.test(lines[k])) : unmatched).map((k) => `<li>${esc(scaledLine(lines[k], factor))}</li>`).join("")}</ul></div>` : ""}
        </div>
        <div class="dots">${steps.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
        <div class="cook-nav"><button class="btn" id="prev" ${i === 0 ? "disabled" : ""}>← Back</button><button class="btn primary" id="next">${i === steps.length - 1 ? "Finished" : "Next →"}</button></div>
      </div>`;
      $("#cookclose").onclick = close; $("#prev").onclick = () => { i--; draw(); };
      $("#next").onclick = () => { if (i === steps.length - 1) close(); else { i++; draw(); } };
      el.querySelectorAll("[data-timer]").forEach((b) => b.onclick = () => { const t = tms[+b.dataset.timer]; addTimer(`${r.title.slice(0, 18)}${r.title.length > 18 ? "…" : ""} · step ${i + 1}: ${t.label}`, t.secs); });
    };
    const onKey = (e) => { if (e.key === "Escape") close(); if (e.key === "ArrowRight") $("#next")?.click(); if (e.key === "ArrowLeft") $("#prev")?.click(); };
    const close = () => { el.hidden = true; el.innerHTML = ""; document.removeEventListener("keydown", onKey); if (wake) { wake.release().catch(() => {}); wake = null; } };
    el.hidden = false; draw(); document.addEventListener("keydown", onKey);
    let tx = null, ty = null;
    el.addEventListener("touchstart", (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
    el.addEventListener("touchend", (e) => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = ty = null; if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { try { navigator.vibrate?.(10); } catch {} (dx < 0 ? $("#next") : $("#prev"))?.click(); } }, { passive: true });
    el.addEventListener("click", (e) => { if (e.target.closest("button, a, .cook-ings")) return; const body = e.target.closest(".cook-body, .cook-step"); if (!body) return; const w = el.getBoundingClientRect().width; (e.clientX > w / 2 ? $("#next") : $("#prev"))?.click(); });
    if (navigator.wakeLock) navigator.wakeLock.request("screen").then((w) => { wake = w; }).catch(() => {});
  }

  // ---------- shopping list ----------
  function mergedList() {
    const groups = new Map(); // key: unit-kind + name
    for (const id of state.list) {
      const r = byId(id); if (!r) continue;
      for (const line of r.ingredients || []) {
        if (/^#/.test(line)) continue;
        const p = parseQty(line);
        const rest = p ? p.rest : line; const { unit, name } = splitUnit(rest);
        const cleanName = name.replace(/\([^)]*\)/g, "").split(",")[0].trim().toLowerCase();
        const kind = UNIT_KIND(unit)?.[0] || unit || "";
        const key = cleanName || line.toLowerCase();
        const g = groups.get(key) || { name: cleanName || line, parts: [], from: new Set() };
        if (p) { const k = g.parts.find((x) => x.kind === kind); if (k) k.qty += p.a; else g.parts.push({ kind, unit, qty: p.a }); }
        else g.parts.push({ kind: "", unit: "", qty: 0, raw: line });
        g.from.add(r.title); groups.set(key, g);
      }
    }
    return [...groups.values()].sort((a, b) => a.name.localeCompare(b.name)).map((g) => ({
      name: g.name, from: [...g.from],
      qty: g.parts.map((x) => x.raw ? "" : (fmtQty(x.qty) + (x.unit ? " " + x.unit + (x.qty > 1 && /^(cup|tbsp|tsp)$/.test(x.kind) && !/s$/.test(x.unit) ? "s" : "") : ""))).filter(Boolean).join(" + "),
    }));
  }

      const err = $("#err"), save = $("#save"); const title = d.title.trim();
      if (!title) { err.textContent = "Give the recipe a name."; err.hidden = false; return; }
      if (!state.store) { err.textContent = "Not connected to the shared recipe box right now."; err.hidden = false; return; }
      const num = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : null; };
      const now = Date.now(), existing = d.id ? current() : null;
      const body = {
        title, category: d.category, cuisine: d.cuisine, servings: d.servings.trim(), prepMin: num(d.prepMin), cookMin: num(d.cookMin),
        ingredients: d.ingredients.split("\n").map((s) => s.trim()).filter(Boolean),
        steps: d.steps.split(/\n\s*\n/).map((s) => s.replace(/\s+/g, " ").trim()).filter(Boolean),
        notes: d.notes.trim(), tags: d.tags.split(",").map((s) => s.trim()).filter(Boolean), thumb: d.thumb || "", source: (d.source || "").trim(), variantOf: d.variantOf || "", equipment: (d.equipment || "").split("\n").map((x) => x.trim()).filter(Boolean), family: (d.family || "").trim(),
        authorId: existing?.authorId || state.me?.id || null, createdAt: existing?.createdAt || now, updatedAt: now,
      };
      save.disabled = true; err.hidden = true;
      try {
        const id = await state.store.saveRecipe(d.id, body);
        if (d.photoChanged) await state.store.setPhoto(id, d.full || "");
        toast(d.id ? "Saved" : d.variantOf ? "Variation added" : "Added. Mangia!");
        state.draft = null; openDetail(id);
      } catch (ex) {
        save.disabled = false; const code = ex?.code;
        err.textContent = code === "permission-denied" ? "The recipe box isn't accepting changes right now. Tell Tony."
          : code === "quota_exceeded" ? "The recipe box is full. Delete a few recipes to make room."
          : "Couldn't save: " + (ex?.message || code || "try again");
        err.hidden = false;
      }
    };
    if (!d.title) $("#f-title").focus({ preventScroll: true });
  }

  // ---------- import: paste text from any website, Claude fills in the form ----------
  function renderImport() {
    stopComments();
    main.innerHTML = `
      <button class="btn ghost back" id="back">← Cancel</button>
      <form class="editor" id="iform">
        <h2>Import a recipe</h2>
        <p class="lead">Paste a link to a recipe on any website, paste the recipe text, or take a photo of a recipe card, a cookbook page, or someone's handwriting. It gets sorted into the form; you check it over and save.</p>
        <p class="err" id="ierr" hidden></p>
        <div class="field" id="i-photo-field"><label>Photos of the recipe <span class="hint">a card, a page, a screenshot; add more than one for a recipe that runs onto a second card, in order</span></label>
          <div class="photo-field" id="i-photos"></div>
          <div class="photo-field">
            <label class="btn sm" for="i-photo" id="i-photo-label">📷 Take or choose a photo</label>
            <input id="i-photo" type="file" accept="image/*" multiple>
            <button type="button" class="btn sm ghost" id="i-nophoto" hidden>Remove all</button>
          </div></div>
        <div class="field"><label for="i-url">Link to the recipe <span class="hint">paste a link and we'll fetch it; also kept on the recipe as its source</span></label><input id="i-url" type="url" value="${esc(state.importUrl)}" placeholder="https://…"></div>
        <div class="field"><label for="i-text">Pasted recipe <span class="hint">if there's no link, or notes to go with the photo</span></label><textarea id="i-text" style="min-height:200px" placeholder="Paste the whole recipe here…">${esc(state.importText)}</textarea></div>
        <div class="editor-actions">
          <button type="button" class="btn" id="icancel">Cancel</button>
          <button type="submit" class="btn primary" id="igo">Sort it out</button>
        </div>
      </form>`;
    const back = () => { state.view = "list"; renderList(); };
    $("#back").onclick = back; $("#icancel").onclick = back;
    $("#iform").oninput = () => { state.importText = $("#i-text").value; state.importUrl = $("#i-url").value; };
    const photos = []; // { file, thumb } in the order added
    const drawPhotos = () => {
      const box = $("#i-photos");
      box.innerHTML = photos.length ? photos.map((p, i) => `<span class="pthumb"><img src="${p.thumb}" alt=""><i>${i + 1}</i><button type="button" data-rm="${i}" aria-label="Remove">×</button></span>`).join("") : `<span class="ph">no photos yet</span>`;
      box.querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => { photos.splice(+b.dataset.rm, 1); drawPhotos(); });
      $("#i-photo-label").textContent = photos.length ? "📷 Add another photo" : "📷 Take or choose a photo";
      $("#i-nophoto").hidden = !photos.length;
    };
    drawPhotos();
    $("#i-photo").onchange = async (e) => {
      for (const file of [...e.target.files]) { try { const img = await loadImage(file); photos.push({ file, thumb: shrink(img, 300, .7, 60000) }); } catch { toast("Couldn't read one of the images"); } }
      e.target.value = ""; drawPhotos();
    };
    $("#i-nophoto").onclick = () => { photos.length = 0; drawPhotos(); };
    const photoFile = { get length() { return photos.length; } };
    $("#iform").onsubmit = async (e) => {
      e.preventDefault();
      const text = $("#i-text").value.trim(), url = $("#i-url").value.trim(), err = $("#ierr"), go = $("#igo");
      if (!photos.length && text.length < 40 && !/^https?:\/\//.test(url)) { err.textContent = "Paste a link, the recipe text, or add a photo first."; err.hidden = false; return; }
      go.disabled = true; go.textContent = "Reading…"; err.hidden = true;
      try {
        const data = photos.length ? await state.ai.importPhotos(photos.map((p) => p.file), text) : text.length >= 40 ? await state.ai.importText(text) : await state.ai.importUrl(url);
        if (!data || typeof data !== "object" || !data.title) throw { code: "invalid_json" };
        const arr = (v) => Array.isArray(v) ? v.map((x) => String(x).trim()).filter(Boolean) : [];
        state.draft = {
          id: null, title: String(data.title).slice(0, 120), category: CATS.includes(data.category) ? data.category : "Other", cuisine: CUISINES.includes(data.cuisine) ? data.cuisine : "Other",
          servings: data.servings ? String(data.servings) : "", prepMin: data.prepMin || "", cookMin: data.cookMin || "",
          ingredients: arr(data.ingredients).join("\n"), steps: arr(data.steps).join("\n\n"), notes: data.notes ? String(data.notes) : "",
          tags: arr(data.tags).join(", "), thumb: "", full: null, photoChanged: false, source: url, variantOf: "", equipment: arr(data.equipment).join("\n"), family: "",
        };
        state.importText = ""; state.importUrl = "";
        state.view = "edit"; renderEditor(); toast("Check it over, then save");
      } catch (ex) {
        go.disabled = false; go.textContent = "Sort it out";
        const code = ex?.code;
        err.textContent = code === "fetch_failed" ? "Couldn't open that link. Some sites block this; try pasting the recipe text instead."
          : code === "no_recipe" ? "Couldn't find a recipe on that page. Try pasting the recipe text instead."
          : code === "rate_limited" ? "The import helper is busy — give it a minute and try again."
          : code === "invalid_json" || code === "empty_completion" ? (photos.length ? "Couldn't read a recipe out of those photos. Try clearer, straight-on shots with good light." : "Couldn't make sense of that. Try pasting just the recipe part of the page.")
          : code === "image_rejected" || code === "images_unavailable" ? "That photo couldn't be sent. Try a different image, or paste the text instead."
          : "Couldn't import: " + (ex?.message || code || "try again");
        err.hidden = false;
      }
    };
    $("#i-text").focus({ preventScroll: true });
  }

  // ---------- favorites ----------
  let favBusy = false;
  async function toggleFav(id) {
    if (!state.store || !state.me?.id || favBusy) return;
    favBusy = true;
    const next = new Set(state.favs); next.has(id) ? next.delete(id) : next.add(id);
    try { await state.store.setFavs(state.me.id, [...next]); state.favs = next; if (state.view === "detail") renderDetail(); }
    catch (e) { toast("Couldn't save favorite; check your connection"); }
    finally { favBusy = false; }
  }

  // ---------- who's cooking? (identity) ----------
  function openWho(force) {
    const m = $("#modal"); const known = Object.entries(users.map).map(([id, u]) => ({ id, ...u })).sort((a, b) => (a.name || "").localeCompare(b.name || ""));
    const cur = ls.get("mm-user", null);
    m.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-label="Who's cooking?">
      <h2>Who's cooking?</h2>
      <p class="lead">Pick your name so recipes, ratings, and notes get credited to you. No password; this is a friends-only box, so we trust you.</p>
      ${known.length ? `<div class="pick-list" style="max-height:40vh">${known.map((u) => `<button class="pick-row" data-u="${esc(u.id)}" type="button"><span style="display:flex;align-items:center;gap:10px"><img src="${avatarFor(u.name, u.color)}" alt="" style="width:26px;height:26px;border-radius:50%">${esc(u.name)}</span>${cur?.id === u.id ? "<small>that's you now</small>" : ""}</button>`).join("")}</div>` : ""}
      <form id="whoform"><div class="field"><label for="who-name">${known.length ? "Not listed? Add yourself" : "Your name"}</label><input id="who-name" maxlength="40" placeholder="First name is fine" autocomplete="off"></div>
      <div class="modal-actions">${cur && force ? `<button class="btn" type="button" id="who-cancel">Cancel</button>` : ""}<button class="btn primary" type="submit">That's me</button></div></form>
    </div></div>`;
    m.hidden = false;
    const done = async (u) => { ls.set("mm-user", { id: u.id, name: u.name, color: u.color }); m.hidden = true; m.innerHTML = ""; await applyUser(); render(); };
    m.querySelectorAll("[data-u]").forEach((b) => b.onclick = () => { const u = users.map[b.dataset.u]; if (u) done({ id: b.dataset.u, ...u }); });
    const c = $("#who-cancel"); if (c) c.onclick = () => { m.hidden = true; m.innerHTML = ""; };
    $("#whoform").onsubmit = async (e) => {
      e.preventDefault(); const name = $("#who-name").value.trim(); if (!name) return;
      const id = "u-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24) + "-" + Math.random().toString(36).slice(2, 6);
      const color = AV_COLORS[[...name].reduce((a, ch) => a + ch.charCodeAt(0), 0) % AV_COLORS.length];
      try { await state.store.saveUser(id, { name, color, createdAt: Date.now() }); users.map[id] = { name, color }; await done({ id, name, color }); }
      catch { toast("Couldn't save your name; check your connection"); }
    };
    $("#who-name").focus();
  }
  async function applyUser() {
    const user = makeUser(users); state.store.me = async () => user.me(); state.store.canWrite = async () => user.can(); state.store.profiles = async (ids) => user.profiles(ids);
    state.me = user.me(); state.canWrite = user.can();
    const who = $("#who");
    if (state.me) { who.innerHTML = `<img src="${esc(state.me.avatarUrl)}" alt=""><button class="btn sm ghost" id="switch"></button>`; $("#switch").textContent = state.me.name || "you"; $("#switch").title = "Not you? Switch"; $("#switch").onclick = () => openWho(true); }
    else who.innerHTML = `<button class="btn sm" id="switch">Who's cooking?</button>`, $("#switch").onclick = () => openWho(true);
    if (state._favSub) { state._favSub(); state._favSub = null; }
    if (state.me?.id) { state._favSub = state.store.subscribeFavs(state.me.id, (ids) => { state.favs = new Set(ids); if (state.view !== "edit" && state.view !== "import") render(); }); }
  }

  // ---------- boot ----------
  // Light by default (the tablecloth is meant to be seen); the switch remembers each person's choice.
  function applyTheme() { const t = ls.get("mm-theme", "light"); document.documentElement.dataset.theme = t; $("#theme").textContent = t === "dark" ? "☀" : "☾"; }
  $("#theme").onclick = () => { ls.set("mm-theme", ls.get("mm-theme", "light") === "dark" ? "light" : "dark"); applyTheme(); };
  function start() {
    applyTheme();
    const h = (location.hash || "").slice(1);
    if (/^[A-Za-z0-9._~-]+$/.test(h)) { state.currentId = h; state.view = "detail"; }
    window.addEventListener("hashchange", () => { const id = (location.hash || "").slice(1); if (id && id !== state.currentId && byId(id)) openDetail(id); });
    render();
    connect();
  }

  async function connect() {
    const store = store_(db, makeUser(users)); state.store = store;
    state.ai = makeAI(CONFIG.workerUrl);
    let usersFirst = true;
    store.subscribeUsers(async () => {
      await applyUser();
      if (usersFirst) { usersFirst = false; if (!ls.get("mm-user", null)) openWho(false); }
      if (state.view === "list" || state.view === "detail") render();
    });

    let first = true;
    store.subscribeRecipes((list) => {
      state.recipes = list; state.ready = true;
      if (state.view === "detail" && !current()) { if (first) toast("That recipe isn't here any more"); state.view = "list"; }
      if (state.view !== "edit" && state.view !== "import") render();
      if (state.view === "detail" && state.currentId && !state.unsubComments) openDetail(state.currentId);
      first = false;
    }, (e) => { state.ready = true; showBanner("Couldn't load recipes: " + (e?.message || e?.code || "check your connection")); render(); });

    store.subscribeRatings((list) => { state.ratings = list; if (state.view === "list" || state.view === "detail") render(); });
    store.subscribeBattles((list) => { state.battles = list; if (state.view === "list" || state.view === "detail") render(); });
    store.subscribeBattleVotes((list) => { state.battleVotes = list; if (state.view === "detail") render(); });
  }

  // Offline: a service worker keeps the app itself on the phone; Firestore's cache keeps the recipes.
  if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
  const netNote = () => { const b = $("#banner"); if (!navigator.onLine) { b.textContent = "You're offline. Recipes you've opened before still work; anything you add will sync when you're back."; b.hidden = false; } else if (/offline/.test(b.textContent)) { b.hidden = true; } };
  window.addEventListener("online", netNote); window.addEventListener("offline", netNote); netNote();
  start();
})();
</script>
</body>
</html>
